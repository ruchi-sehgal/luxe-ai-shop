availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/MONGO_URI/versions/latest
      env: 'MONGO_URI'
    - versionName: projects/$PROJECT_ID/secrets/GROQ_API_KEY/versions/latest
      env: 'GROQ_API_KEY'

steps:
  # 1. Install dependencies and run the eval suite — everything below only runs if this passes
  - name: 'python:3.12-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        python -m pytest tests/ -v
    secretEnv: ['MONGO_URI', 'GROQ_API_KEY']

  # 2. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/luxe-ai-shop-repo/luxe-ai-shop:$COMMIT_SHA', '.']

  # 3. Push it to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/luxe-ai-shop-repo/luxe-ai-shop:$COMMIT_SHA']

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'luxe-ai-shop-web'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/luxe-ai-shop-repo/luxe-ai-shop:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--set-secrets'
      - 'MONGO_URI=MONGO_URI:latest,GROQ_API_KEY=GROQ_API_KEY:latest'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/luxe-ai-shop-repo/luxe-ai-shop:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY